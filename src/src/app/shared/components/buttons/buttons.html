Shared button 
<button
  [disabled]="isDisabled"
  [ngClass]="['btn', 'btn-' + variant, 'btn-' + size, isStatus ? 'btn-status' : '']"
  [style.--btn-color]="color" (click)="onClick()">

  <mat-icon *ngIf="icon && iconPosition === 'left'">{{ icon }}</mat-icon>
  <ng-content></ng-content>
  <mat-icon *ngIf="icon && iconPosition === 'right'">{{ icon }}</mat-icon>
</button>
