<app-header-filter class="header-filter"></app-header-filter>
<app-table-header [showFreezeButton]="true" [showSearch]="false" [showNewIdea]="false"></app-table-header>
<app-table-filter [tabs]="statusTabs"></app-table-filter>
<app-table
  [columns]="ideaDisplayColumns"
  [dataSource]="pagedIdeas"
  [currentFilterStatusId]="currentFilterStatusId"
  [showFreezeButton]="true"
  [showCheckboxColumn]="currentFilterStatusId === 13"
  [selectedIdeaIds]="selectedIdeaIds"
  (selectedIdeaIdsChange)="selectedIdeaIds = $event"
  [dropdownStyle]="'nested'"
  [from]="'funding'"
></app-table>
<app-pagination [totalPages]="totalPages" [currentPage]="currentPage"></app-pagination>
