<app-header-filter class="header-filter"></app-header-filter>
<app-table-header [showSearch]="false" [showNewIdea]="false" exportVariant="type1"
    exportColor="var(--primary-400)"></app-table-header>
<app-table-filter [tabs]="statusTabs" [activeStatusId]="currentFilterStatusId"></app-table-filter>
<app-table [columns]="displayedColumns" [dataSource]="displayedIdeas" [currentFilterStatusId]="currentFilterStatusId"
    [useViewIdeaOverlay]="true"></app-table>
@if (showPagination) {
  <app-pagination [totalPages]="totalPages" [currentPage]="currentPage"></app-pagination>
}
@if (showRankingButtons) {
  <div class="ranking-actions">
    <app-buttons variant="type2" color="var(--primary-400)" size="medium" (click)="saveRanking()">
      Save Ranking
    </app-buttons>
    <app-buttons
      variant="type1"
      color="var(--primary-400)"
      size="medium"
      [isDisabled]="!allIdeasRanked && currentFilterStatusId === taPrioritizationPendingStatusId"
      (click)="submitRanking()">
      Submit Ranking
    </app-buttons>
  </div>
}

<app-popup [open]="popup.open" [title]="popup.title" [helper]="popup.helper" [cancelText]="popup.cancelText"
    [confirmText]="popup.confirmText" [size]="popup.size" [confirmPopupAction]="popup.confirmPopupAction"
    [showCancelButton]="popup.showCancelButton ?? true"></app-popup>

<app-idea-history [open]="showIdeaHistory" [ideaId]="selectedIdeaId" [ideaUid]="selectedIdeaUid"></app-idea-history>

<app-view-idea-overlay
  [open]="showViewIdeaOverlay"
  [ideaUid]="overlayIdeaUid"
  [ideas]="filteredIdeas"
  [referrer]="'/ta-prioritization'"
  [statusLabel]="overlayStatusLabel"
  (closeOverlay)="showViewIdeaOverlay = false; overlayIdeaUid = null; overlayStatusLabel = null"
  (editDetails)="onEditFromOverlay($event)"
></app-view-idea-overlay>
