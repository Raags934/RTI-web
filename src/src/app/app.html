@if (showShell) {
  <mat-sidenav-container class="app-shell" autosize>
    <mat-sidenav mode="side" opened class="app-sidenav" [class.app-sidenav-collapsed]="isSidebarCollapsed">
      <app-sidebar (sidebarToggled)="onSidebarToggled($event)"></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="app-content pxr-16" [class.app-content-sidebar-collapsed]="isSidebarCollapsed">
      <app-header></app-header>
      <router-outlet></router-outlet>
      <app-toast [message]="createIdeaToast.message" [show]="createIdeaToast.visible" [type]="createIdeaToast.type ?? 'success'"></app-toast>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet></router-outlet>
  <app-toast [message]="createIdeaToast.message" [show]="createIdeaToast.visible" [type]="createIdeaToast.type ?? 'success'"></app-toast>
}
